<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Sprint</title><style>
*{box-sizing:border-box}body{margin:0;background:#10233a;color:#f1faf6;font:17px/1.5 system-ui,sans-serif}main{max-width:740px;margin:auto;padding:36px 24px}h1{font-size:clamp(2.8rem,8vw,5rem);margin:0;line-height:1}header p{color:#b0d6cf}form,.board{background:#19334b;border:1px solid #547783;border-radius:12px;padding:16px;margin-top:18px}label{display:block;margin-bottom:8px}input,button{font:inherit;padding:7px 10px;border-radius:6px}input:not([type=checkbox]){display:block;width:100%;margin-top:4px;border:1px solid #c1ddd5}button{background:#adf0d3;color:#10233a;border:0;cursor:pointer}button[aria-pressed=false]{background:#eaf6f3}progress{width:100%;accent-color:#adf0d3}ul{padding:0;list-style:none}li{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #547783;padding:8px 0;gap:10px}li label{margin:0}small{color:#c3e0da}
</style><script defer src="planner.js"></script></head><body><main>
<header><small>STUDY PLANNER</small><h1>Study Sprint</h1><p>Plan a few study tasks and track what you finish.</p></header>
<form><label>Study task<input name="task" required maxlength="90"></label><label>Subject<input name="subject" required maxlength="40"></label><button>Add task</button></form>
<section class="board"><h2>My study tasks</h2><p id="summary" aria-live="polite"></p><progress aria-label="Study task completion"></progress><div id="filters"><button data-filter="all" aria-pressed="true">All</button> <button data-filter="active" aria-pressed="false">Active</button> <button data-filter="completed" aria-pressed="false">Completed</button></div><ul></ul><p id="empty" hidden>No tasks in this view.</p></section>
</main></body></html>
